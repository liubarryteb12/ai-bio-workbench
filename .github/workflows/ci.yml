name: CI

on:
  push:
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: LF check for executable scripts
        run: |
          bad=$(grep -rlP '\r$' --include='*.sh' --include='*.py' --include='*.R' src ops shared bin 2>/dev/null || true)
          if [ -n "$bad" ]; then echo "CRLF found in:"; echo "$bad"; exit 1; fi
      - name: Three-line isolation check
        shell: pwsh
        run: ./ops/02_check_isolation.ps1

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BioanalysDesktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: BioanalysDesktop/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build