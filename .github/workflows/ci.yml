# 私有仓库 CI：与本地 npm run gate:all 行为 100% 同构（4 Argon 第二十四轮 Q4）。
#
# 为什么保持私有：本仓库含核心商业生信母版与交付底座，公开即等于把资产暴露给爬虫。
# GitHub Private 免费额度（2000 分钟/月）对本流水线绰绰有余：单轮约 3 分钟，
# 即使每天推 5 次，一个月也只消耗约 375 分钟。
#
# 与本地唯一的差异：Runner 上没有 K40 真机，依赖真机的用例按 HOST_UNREACHABLE_K40
# 白名单原因跳过（skip_reason_gate 会核验每条跳过都带合法标签，无理由跳过照样红）。
name: gates

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  gate-all:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 Schema 网关依赖
        # schema_gateway.py 与 requirement 三源对齐用例都依赖 pydantic。
        # 锁到项目既有 env_lock 版本，避免 Runner 上的版本漂移改变校验行为。
        # PyYAML 供 router_gate 类型感知交叉校验，缺它时 YAML 标量陷阱用例会静默降级。
        run: python -m pip install pydantic==2.14.1 pydantic-settings==2.16.1 PyYAML
      - name: 安装前端依赖
        working-directory: BioanalysDesktop
        run: npm ci || npm install
      - name: 前端类型检查（tsc --noEmit）
        # tsconfig.json 一直在仓库里，本地实跑 exit 0，但 CI 从不调用它：
        # 类型回归只能靠人记得在本地跑，等于没有门禁。
        working-directory: BioanalysDesktop
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: 构建前端（dist/）
        # 本地开发者先 build 过，static_assets_contract 的合法与 404 用例依赖 dist/index.html，
        # 干净 Runner 缺 dist 时会误红。e2e job 已构建，这道门禁同样需要。
        working-directory: BioanalysDesktop
        run: npm run build
      - name: 单命令总门禁（与本地同构）
        # gate:all 内含 preflight/static/skip_static/ledger/figure_registry/audit_summary/
        # mutation_gate/metrics 八道；任一道红即整体红，exit 非 0 会直接让 job 失败。
        # mutation_gate 在 CI 上同样只在临时副本上变异，不写工作树。
        env:
          BIO_METRICS_TAP_DUMP: .tmp/ci_metrics.tap
        run: node tools/dev/run_all_gates.mjs --json
      - name: 打印失败用例诊断
        if: failure()
        # 门禁 JSON 只留 80 行 tail，TAP 里的 error 栈才是根因。
        run: |
          grep -A 18 '^not ok' .tmp/ci_metrics.tap || true
          grep -n -B 4 -A 4 '^# SKIP$' .tmp/ci_metrics.tap || true
      - name: 门禁结果留档
        if: always()
        # 留档步骤与门禁步骤跑同一套判据，失败时它也必须红。此前这里用「或裸 true」的
        # 短路兜底吞掉退出码，结果日志里写着 GATE_ALL_FAILED 而 job 仍绿，
        # 事后翻日志的人会以为失败被容忍了。
        run: node tools/dev/run_all_gates.mjs --skip-tests

  e2e:
    # Playwright 单列一个 job：浏览器二进制下载与安装要 1~2 分钟，
    # 与门禁 job 混在一起会把「门禁红」和「浏览器没装」两类失败混成一团。
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装前端依赖
        working-directory: BioanalysDesktop
        run: npm ci || npm install
      - name: 构建前端（dist/）
        # admin 面 e2e 由 server/index.js 托管 dist/，dist 是构建产物不进 git。
        # 本地开发者跑 e2e 前已 build 过所以从没暴露；CI 缺这步，静态托管拿
        # 到的是 404 页，27 个 spec 全部 tab-nav-item 找不到（20 失败 6 通过）。
        working-directory: BioanalysDesktop
        run: npm run build
      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('BioanalysDesktop/package-lock.json') }}
      - name: 安装 Playwright 浏览器
        # 缺 --with-deps 会缺系统库，27 个 spec 全部 browser not found。
        # 必须用项目自带的 playwright（devDependencies），不能裸 npx：裸 npx
        # 在 PATH 上找不到 playwright 时会临时装最新版，浏览器 build 号与
        # 锁定的 @playwright/test 对不上，27 个 spec 全部 Executable doesn't exist。
        working-directory: BioanalysDesktop
        run: npx --no-install playwright install --with-deps chromium
      - name: 端到端（playwright 27 个 test）
        # playwright.config.ts 自带两个 webServer（portal 9321 / admin 9322），
        # admin 面在 D-29 Fail-Closed 后强制 Basic 鉴权，凭据写在 config 的 env 里，
        # 这里不重复传，避免两处真源。
        working-directory: BioanalysDesktop
        run: npm run test:e2e

# 刻意不在 CI 里做的事：
#   - delivery:verify：需要具体客户 tar，属订单级动作，不属仓库级门禁
#   - clean:workspace：破坏性动作，绝不由 CI 自动触发
#   - 任何 SSH/adb：CI 无真机，链路类断言一律按白名单原因跳过
