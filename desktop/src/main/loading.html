<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline';" />
    <title>Bioanalys 工作台</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; background: #0f172a; color: #e2e8f0;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      .box { text-align: center; }
      .mark {
        width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 18px;
        background: linear-gradient(135deg, #0d9488, #0ea5e9);
        display: grid; place-items: center; font-size: 30px; font-weight: 700; color: #fff;
      }
      h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
      p { color: #94a3b8; font-size: 13px; margin: 0; }
      .bar { width: 180px; height: 3px; margin: 22px auto 0; background: #1e293b; border-radius: 3px; overflow: hidden; }
      .bar::after {
        content: ""; display: block; width: 40%; height: 100%; border-radius: 3px;
        background: #2dd4bf; animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(280%); } }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="mark">B</div>
      <h1>Bioanalys 工作台</h1>
      <p>正在启动本地服务与界面...</p>
      <div class="bar"></div>
    </div>
  </body>
</html>
